name: MJVPlayer
options:
  bundleIdPrefix: com.mjv
  deploymentTarget:
    iOS: "16.0"
packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    branch: main
targets:
  MJVPlayer:
    type: application
    platform: iOS
    sources:
      - path: MJVPlayer
    dependencies:
      - package: YouTubeKit
    settings:
      base:
        PRODUCT_NAME: MJVPlayer
        PRODUCT_BUNDLE_IDENTIFIER: com.mjv.player
        INFOPLIST_FILE: MJVPlayer/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.1.3"
        CURRENT_PROJECT_VERSION: "5"
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: NO
schemes:
  MJVPlayer:
    build:
      targets:
        MJVPlayer: all
