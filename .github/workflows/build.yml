name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned; Sideloadly signs it)
        run: |
          set -o pipefail
          xcodebuild -version
          if ! xcodebuild -project MJVPlayer.xcodeproj -scheme MJVPlayer -configuration Release \
              -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
              -skipPackagePluginValidation -skipMacroValidation \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              build > build.log 2>&1; then
            grep -E "error:|BUILD FAILED" build.log | sort -u | head -150
            tail -40 build.log
            exit 1
          fi
          grep -E "warning:" build.log | grep "/MJVPlayer/" | sort -u | head -80 || true
          test -f build/Build/Products/Release-iphoneos/MJVPlayer.app/MJVPlayer

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/MJVPlayer.app Payload/
          zip -qry MJVPlayer.ipa Payload
          ls -l MJVPlayer.ipa
          shasum -a 256 MJVPlayer.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MJVPlayer-ipa
          path: MJVPlayer.ipa
          retention-days: 30
